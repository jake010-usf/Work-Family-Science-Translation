<main id="app"></main><div id="edbar"></div><script id="txt" type="application/json">{"And your partner?":"How often does your partner work from home?","This quiz is a fun approximation, not a validated test. Your partner’s type is your guess.":"This quiz is a fun approximation, not a validated test. Both your profile and your partner's are estimated from your responses to the situational questions.","The big idea: the dial":"The big idea: ","You’re comfortable with work and home mixing. A quick email on the couch doesn’t bother you.":"You’re mostly comfortable with work and home mixing. You find it easy to talk about work or fulfill a work demand, even if you're at home with your family/partner. It doesn't bother you to switch between those roles frequently.","You described a":"You described them as a","This is your perception, so the pattern is only as accurate as your read. Have your partner take the quiz and compare.":"This is your perception, so the pattern is only as accurate as your read. Have your partner take the quiz and compare your results!","Surprise: mismatched couples did \u003cb>not\u003c/b> report more work-to-home conflict on average. Different preferences aren’t automatically a problem. It depends on the dial (work-from-home hours) and, in this study, on gender.":"Surprise: mismatched couples did \u003cb>not\u003c/b> report more work-to-home conflict on average. Different preferences aren’t automatically a problem. It depends on if one person works from home 40+ hours and on gender.","You: hybrid hours weren’t tested (the study compared ~0 vs. ~40 hrs). Think of it as somewhere between.":"You: hybrid hours weren’t tested in the study. We hypothesize that the impact of having mismatched boundary preferences falls somewhere in-between the impacts seen for 0 work hours at home vs 40+ work hours at home.","Your partner: hybrid hours weren’t tested (the study compared ~0 vs. ~40 hrs). Think of it as somewhere between.":"Your partner: hybrid hours weren’t tested in the study. We hypothesize that the impact of having mismatched boundary preferences falls somewhere in-between the impacts seen for 0 work hours at home vs 40+ work hours at home.","You’re mid-movie and a work email pings. You…":"You’re 10 minutes into watching a movie with your partner when a work email pings. You…","Check it and maybe reply. It’s just an email.":"Check it and reply immediately","Peek, reply if it’s quick.":"Read it, reply if it’s quick/urgent.","Wait until the movie’s over.":"Wait until the movie’s over to look at it.","Phone stays across the room.":"Only read work emails during work hours.","Probably not":"Unsure","Try to save it for later.":"Save it for after dinner.","Dinner is a work-free zone.":"Rarely talk about work at home.","Vent. That’s what partners are for.":"Talk about it all throughout dinner.","Mention it briefly.":"Mention it briefly in conversation.","It’s 9 pm and a work message arrives. You…":"It’s 8 pm and you get a call about work problem. You…","Answer it. Easier to clear now.":"Answer the call and try to figure it out right now.","Read it, answer if urgent.":"Answer the call but only respond if its for something urgent.","Leave it till morning, mostly.":"Send a text/email that you will get back to them in the morning.","A work call runs into family time. How does that feel?":"An online work meeting runs into your family time. How does that feel?","It bugs me a lot.":"I hate it.","A little off, but fine.":"It doesn't happen much so it's fine.","Check it and maybe reply.":"Check it and reply immediately.","Peek, reply if quick.":"Read it, reply if it's quick/urgent.","Wait until later.":"Wait until the movie is over to look at it.","Ignore it completely.":"Ignore it completely until the next time they work.","Not sure":"I'm not sure","Mentions it a little.":"Mentions it sometimes.","Insists on keeping it out.":"Insists on only talking about work while at work.","Answer a few quick questions. You’ll get your type, a look at how you and a partner might fit together, and what one 2026 study found about work-to-home conflict. The questions adapt to your situation, whether you’re single, dating, or living together.":"Answer a few quick questions. You’ll get your boundary preference type, a look at how you and a partner might fit together, and what one 2026 study found about work-to-home conflict. The questions adapt to your situation, whether you’re single, dating, or living together.","Fun, not a diagnosis. About 3 minutes.":"This quiz is not a diagnosis and does not claim to know your true situation. It is purely for fun and estimation purposes.","The gender-specific findings came from heterosexual couples, so we can’t say how they apply to your situation.":"The gender-specific findings came from heterosexual couples, so we can’t say exactly how they might apply to your situation.","Across patterns, boundary preferences mattered most when someone worked from home about full-time. With people mostly at the office, couples seemed to smooth over differences. And because you share one home, your preference is only half the story: how it plays out depends on your partner’s too.":"Boundary preferences mattered most when someone worked from home full-time. When this was the case, if both partners were Blenders they saw minimal work-family conflict. If both partners were Seperators or if the couple was mis-matched, work-family conflict was a more probable outcome. When both partners mostly worked at the office rather than at home, couples seemed to smooth over differences easier and had little conflict. Remember: when you share one home, your preference is only half the story: how it plays out depends on your partner’s preferences too.","A few nights a week":"Sometimes","Rarely":"Rarely/Never","About full-time (35–40+ hrs)":"Full-time (35–40+ hrs)","You don’t live together, and the study’s idea is about a shared home. This is a preview of what could matter if you move in.":"You don’t live together, and the study’s idea is about a shared home. This is a preview of what could matter if you move in and live together one day.","You like a firm wall between work and home. Blurring feels like an intrusion.":"You like a firm wall between work and home. Blurring the lines between them feels like an intrusion. You don't like to engage with work tasks outside of work hours, and you may not like talking about work at home. You prefer that the two worlds stay seperate.","You weren’t sure about your partner’s style, which is common. Below we show what each possibility could mean. A good first step is to ask them.":"You weren’t sure about your partner’s style. Below we show what each possibility could mean. A good first step is to ask them, or have them take this quiz as well!","The study’s highest-risk combination. When someone works from home ~40 hrs/week, two Separators reported \u003cb>more work-to-home conflict\u003c/b> than two Blenders. The authors’ explanation (not measured): strict walls in a home that’s also the office, and reluctance to adapt the space, leave the remote worker in a frustrating setup.":"The study’s highest-risk combination. When someone works from home ~40 hrs/week, two Separators reported \u003cb>more work-to-home conflict\u003c/b> than any other combination. The authors’ explanation (not measured): strict walls in a home that’s also the office, and reluctance to adapt the space, leave the remote worker in a frustrating setup.","Yes":"Yes ","No, I’m single":"No, I’m single "}</script>

p2:{s:1,t:function(){return "Work drama is on your mind at dinner. You…"},o:[["Vent. That’s what partners are for.",1],["Mention it briefly.",2],["Try to save it for later.",4],["Dinner is a work-free zone.",5]]},

q1:{s:2,t:function(){return "Your partner is mid-movie and a work email pings. They…"},o:PO("Check it and maybe reply.","Peek, reply if quick.","Wait until later.","Ignore it completely.")},

};

b.innerHTML='<button onclick="toggleEdit()">Edit mode: '+(EDIT?"ON":"OFF")+'</button>'+((EDIT||dirty)?'<button class="go" onclick="save()"'+(dirty?'':' disabled')+'>Save changes</button>':'')+'<span id="edmsg" class="mut">'+(EDIT?"Click any text to edit it. Click the padding around an answer to select it.":"")+'</span>'}

app.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.closest&&e.target.closest(".ed"))e.preventDefault()});
async function save(){msg("Saving…");try{var art=await claude.use("artifact");if(!art){msg("Saving isn’t available in this view.");return}
try{sessionStorage.setItem("wq",JSON.stringify({A:A,hist:hist,edit:EDIT,pg:rpg}))}catch(e){}

var P1=["p1","p2","p3","p4"],P2=["q1","q2"],A={},hist=[];

function start(){A={};hist=[];rpg=1;view=start;app.innerHTML='<p class="mut">'+E("A quiz inspired by new research")+'</p><h1>'+E("Separator or Blender?")+'<br>'+E("What working from home might mean for your relationship")+'</h1><p>'+E("Answer a few quick questions. You’ll get your type, a look at how you and a partner might fit together, and what one 2026 study found about work-to-home conflict. The questions adapt to your situation, whether you’re single, dating, or living together.")+'</p><p class="mut">'+E("Fun, not a diagnosis. About 3 minutes.")+'</p><button class="go" onclick="next()">Start</button>'}

q.o.forEach(function(o,k){h+='<div class="opt" role="button" onclick="pick(event,\''+id+'\','+k+')">'+E(o[0])+'</div>'});
if(hist.length)h+='<button class="back" onclick="back()">← Back</button>';app.innerHTML=h;window.scrollTo(0,0)}

function meter(c,t){var col={g:"var(--g)",a:"var(--a)",r:"var(--r)",n:"var(--n)"}[c];return '<div class="meter"><span class="dot" style="background:'+col+'"></span><b>'+t+'</b></div>'}

function pt(pat,yf,pf,sm){
if(pat==="twoS"){if(yf)return["r",E("The study’s highest-risk combination. When someone works from home ~40 hrs/week, two Separators reported <b>more work-to-home conflict</b> than two Blenders. The authors’ explanation (not measured): strict walls in a home that’s also the office, and reluctance to adapt the space, leave the remote worker in a frustrating setup.")];

if(sm)return["a",E("Hybrid wasn’t tested. The pattern was strongest at ~40 hrs and not meaningful at ~0 hrs, so you’re likely in between. Watch it if hours rise.")];
return["g",E("With little or no work from home, the study found no meaningful difference between couple types. The risk shows up when the dial turns up.")]}
if(pat==="twoB"){if(yf)return["g",E("The study’s lowest-conflict pairing. At ~40 hrs/week at home, two Blenders reported the <b>least work-to-home conflict</b>. The authors’ reasoning: they tolerate overlap, build flexible routines (shared calendars, joint breaks), and may welcome interruptions as a break.")];
if(pf)return["g",E("A partner’s hours weren’t directly tested, but the authors’ reasoning suggests overlap-friendly couples adapt well. A hunch.")];
if(sm)return["g",E("Hybrid wasn’t tested. Nothing suggests trouble, and the Blender advantage was strongest at high hours.")];
return["g",E("With little work from home, couple type made no meaningful difference in the study.")]}
if(pat==="mix")return["n",E("Surprise: mismatched couples did <b>not</b> report more work-to-home conflict on average. Different preferences aren’t automatically a problem. It depends on the dial (work-from-home hours) and, in this study, on gender.")];
